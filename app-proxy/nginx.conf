server {
    listen 80;
    server_name srvapp03.inabif.gob.pe;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name srvapp03.inabif.gob.pe;

    ssl_certificate /etc/nginx/certs/inabif.gob.pe.crt;
    ssl_certificate_key /etc/nginx/certs/inabif.gob.pe-key.pem;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # 1. Frontend paths
    location = /siges {
        return 301 /siges/;
    }

    location = /sisec {
        return 301 /sisec/;
    }

    location = /sigeir {
        return 301 /sigeir/;
    }

    location /siges/ {
        set $siges_upstream app-siges:80;
        rewrite ^/siges/(.*)$ /$1 break;
        proxy_pass http://$siges_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sisec/ {
        set $sisec_upstream app-sisec:80;
        rewrite ^/sisec/(.*)$ /$1 break;
        proxy_pass http://$sisec_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sigeir/ {
        set $sigeir_upstream app-sigeir:80;
        rewrite ^/sigeir/(.*)$ /$1 break;
        proxy_pass http://$sigeir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. API paths
    location /api/ {
        client_max_body_size 100M;
        set $gateway_upstream ms-gateway:4000;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_buffering off;
    }

    location /api/ms-sigeir/ {
        set $ms_sigeir_upstream ms-sigeir:4006;
        proxy_pass http://$ms_sigeir_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $sigeif_upstream app-sigeif:80;
        proxy_pass http://$sigeif_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
