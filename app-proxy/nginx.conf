server {
    listen 80;
    server_name srvapp03.inabif.gob.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name srvapp03.inabif.gob.pe;

    ssl_certificate /etc/nginx/certs/inabif.gob.pe.crt;
    ssl_certificate_key /etc/nginx/certs/inabif.gob.pe-key.pem;

    location = /siges {
        return 301 /siges/;
    }

    location /siges/ {
        proxy_pass http://app-siges:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://ms-gateway:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app-sigeif:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
