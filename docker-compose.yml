x-base-service: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  networks:
    - sigeif-network

services:
  ms-gateway:
    <<: *common
    container_name: ms-gateway
    build:
      context: ./ms-gateway
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${GATEWAY_PORT}
    image: gateway:latest
    ports:
      - ${GATEWAY_PORT}:${GATEWAY_PORT}
    environment:
      - PORT=${GATEWAY_PORT}
      - PROFILE=${GATEWAY_PROFILE}
      - ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS}
      - PUCHE_SERVICE=ms-punche
      - PUCHE_PORT=${PUNCHE_BACKEND_PORT}
      - CEDIF_SERVICE=ms-cedif
      - CEDIF_PORT=${CEDIF_BACKEND_PORT}
      - ACERCANDONOS_SERVICE=ms-acercandonos
      - ACERCANDONOS_PORT=${ACERCANDONOS_BACKEND_PORT}
      - SIGES_SERVICE=ms-siges
      - SIGES_PORT=${SIGES_BACKEND_PORT}
      - SISEC_SERVICE=ms-sisec
      - SISEC_PORT=${SISEC_BACKEND_PORT}
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[j]ava'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ms-punche:
    <<: *common
    container_name: ms-punche
    build:
      context: ./ms-punche/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${PUNCHE_BACKEND_PORT}
    image: ms-punche:latest
    environment:
      - PORT=${PUNCHE_BACKEND_PORT}
      - PROFILE=${PUNCHE_BACKEND_PROFILE}
    expose:
      - ${PUNCHE_BACKEND_PORT}
    restart: always
    depends_on:
      - ms-gateway

  ms-cedif:
    <<: *common
    container_name: ms-cedif
    build:
      context: ./ms-cedif/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${CEDIF_BACKEND_PORT}
    image: ms-cedif:latest
    environment:
      - PORT=${CEDIF_BACKEND_PORT}
      - PROFILE=${CEDIF_BACKEND_PROFILE}
    expose:
      - ${CEDIF_BACKEND_PORT}
    depends_on:
      - ms-gateway

  ms-acercandonos:
    <<: *common
    container_name: ms-acercandonos
    volumes:
      - ./ms-acercandonos/documentos/anexos:/app/src/main/resources/documentos/anexos
    build:
      context: ./ms-acercandonos/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${ACERCANDONOS_BACKEND_PORT}
    image: ms-acercandonos:latest
    environment:
      - PORT=${ACERCANDONOS_BACKEND_PORT}
      - PROFILE=${ACERCANDONOS_BACKEND_PROFILE}
      - TZ=America/Lima
    expose:
      - ${ACERCANDONOS_BACKEND_PORT}
    depends_on:
      - ms-gateway

  ms-siges:
    <<: *common
    container_name: ms-siges
    build:
      context: ./ms-siges/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${SIGES_BACKEND_PORT}
    image: ms-siges:latest
    environment:
      - PORT=${SIGES_BACKEND_PORT}
      - PROFILE=${SIGES_BACKEND_PROFILE}
    expose:
      - ${SIGES_BACKEND_PORT}
    depends_on:
      - ms-gateway

  ms-sisec:
    <<: *common
    container_name: ms-sisec
    build:
      context: ./ms-sisec/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${SISEC_BACKEND_PORT}
    image: ms-sisec:latest
    environment:
      - PORT=${SISEC_BACKEND_PORT}
      - PROFILE=${SISEC_BACKEND_PROFILE}
    expose:
      - ${SISEC_BACKEND_PORT}
    depends_on:
      - ms-gateway

  ms-scheduling:
    <<: *common
    container_name: ms-scheduling
    build:
      context: ./ms-scheduling/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${SCHEDULING_PORT}
    ports:
      - ${SCHEDULING_PORT}:${SCHEDULING_PORT}
    environment:
      - PORT=${SCHEDULING_PORT}
      - PROFILE=${SCHEDULING_BACKEND_PROFILE}
    volumes:
      - ./ms-scheduling/resources/reports:/app/reports

  ms-sigeir:
    <<: *common
    container_name: ms-sigeir
    build:
      context: ./ms-sigeir/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${SIGEIR_BACKEND_PORT}
    image: ms-sigeir:latest
    environment:
      - PORT=${SIGEIR_BACKEND_PORT}
      - PROFILE=${SIGEIR_BACKEND_PROFILE}
      - SSO_INTRANET_INSECURE_SSL=true
      - TZ=America/Lima
    expose:
      - ${SIGEIR_BACKEND_PORT}
    depends_on:
      - ms-gateway

  app-proxy:
    <<: *common
    container_name: app-proxy
    build:
      context: ./app-proxy
      dockerfile: Dockerfile
    image: app-proxy:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      app-sigeif:
        condition: service_healthy
      app-siges:
        condition: service_healthy
      app-sisec:
        condition: service_healthy
      app-sigeir:
        condition: service_healthy

  app-sigeif:
    <<: *common
    container_name: app-sigeif
    build:
      context: ./app-sigeif
      dockerfile: Dockerfile
    image: app-sigeif:latest
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - ms-gateway
      - ms-punche
      - ms-cedif
      - ms-acercandonos

  app-siges:
    <<: *common
    container_name: app-siges
    build:
      context: ./app-siges
      dockerfile: Dockerfile
    image: app-siges:latest
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - ms-gateway
      - ms-siges

  app-sisec:
    <<: *common
    container_name: app-sisec
    build:
      context: ./app-sisec
      dockerfile: Dockerfile
    image: app-sisec:latest
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - ms-gateway
      - ms-sisec

  app-sigeir:
    <<: *common
    container_name: app-sigeir
    build:
      context: ./app-sigeir
      dockerfile: Dockerfile
    image: app-sigeir:latest
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - ms-gateway
      - ms-sigeir

networks:
  sigeif-network:
    name: sigeif-network
    driver: bridge
