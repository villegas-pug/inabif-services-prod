#    depends_on:
#      - ms-gateway
#      - ms-cedif
# ----------------------------------------------------------------------------------------------



# ----------------------------------------------------------------------------------------------
# 5. SCHEDULING - APP
# ----------------------------------------------------------------------------------------------
  ms-scheduling:
    <<: *common
    container_name: ms-scheduling
    build:
      context: ./ms-scheduling/backend
      dockerfile: Dockerfile
      args:
        - PORT_ARG=${SCHEDULING_PORT}
    ports:
      - ${SCHEDULING_PORT}:${SCHEDULING_PORT}
    environment:
      - PORT=${SCHEDULING_PORT}
      - PROFILE=${SCHEDULING_BACKEND_PROFILE}
    volumes:
      - ./ms-scheduling/resources/reports:/app/reports

# ----------------------------------------------------------------------------------------------


# ----------------------------------------------------------------------------------------------
# SHARED
# ----------------------------------------------------------------------------------------------
networks:
  sigeif-network:
    name: sigeif-network
    driver: bridge
# ----------------------------------------------------------------------------------------------