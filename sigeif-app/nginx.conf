server {
    listen 80;
    server_name srvapp03.inabif.gob.pe;
    return 301 https://$host$request_uri;  # Redirige HTTP a HTTPS
}

server {
    listen 443 ssl;
    server_name srvapp03.inabif.gob.pe;

    ssl_certificate /etc/nginx/certs/sigeif-app.crt;
    ssl_certificate_key /etc/nginx/certs/sigeif-app.key;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;  # Importante para SPAs (Vue Router)
    }
}